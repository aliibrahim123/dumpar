[package]
name = "b"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.99"
neoview = { path = "../../neoview" }
neoview-web = { path = "../../web", features = ["html-types", "css-types"] }
rustc-hash = "2.1.2"
wasm-bindgen = "0.2.122"
web-sys = { version = "0.3.99", features = [
	"Element",
	"Document",
	"Window",
	"HtmlInputElement",
	"console",
	"HtmlCollection",
] }
